name: Camel Quarkus CI

on:
  push:
    branches:
      - main
      - camel-main
      - quarkus-main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'camel-quarkus-sbom/**'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/check-dependency-convergence.yml'
      - '.github/workflows/ci-semeru-jdk.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/jdk25-build.yaml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'
  pull_request:
    branches:
      - main
      - camel-main
      - quarkus-main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-lts-ci-build.yaml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  MAVEN_OPTS: -Xmx3000m
  CQ_MAVEN_ARGS: -V -ntp -e -Daether.connector.http.connectionMaxTtl=120
  TESTCONTAINERS_RYUK_DISABLED: true
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.head_ref || '' }}

jobs:
  pre-build-checks:
    if: github.repository == 'apache/camel-quarkus'
    runs-on: ubuntu-latest
    outputs:
      continue-build: ${{ steps.pre-build-checks.outputs.continue-build }}
      run-checks: ${{ steps.init.outputs.run-checks }}
    steps:
      - name: Initialize
        id: init
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            echo "run-checks=true" >> $GITHUB_OUTPUT
          else
            echo "run-checks=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: steps.init.outputs.run-checks == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.init.outputs.run-checks == 'true'
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Pre build checks
        id: pre-build-checks
        run: |
          if [[ "${{ steps.init.outputs.run-checks }}" == "true" ]]; then
            ./mvnw cq:sync-versions -N ${CQ_MAVEN_ARGS}
            ./mvnw clean install -pl poms/bom -am -Dcq.flatten-bom.format --fail-never ${CQ_MAVEN_ARGS}
            ./mvnw clean install -f poms/bom ${CQ_MAVEN_ARGS}
            ./mvnw clean validate -pl docs ${CQ_MAVEN_ARGS}

            if [[ -z "$(git status --porcelain)" ]]; then
              echo "continue-build=true" >> $GITHUB_OUTPUT
            else
              mkdir ./dependabot-pr
              echo ${{ github.head_ref }} > ./dependabot-pr/BRANCH_REF
              echo ${{ github.event.pull_request.head.sha }} > ./dependabot-pr/PR_HEAD_SHA
              echo "$GITHUB_REF" | awk -F / '{print $3}' >  ./dependabot-pr/PR_NUMBER
              git diff -p --binary > ./dependabot-pr/changes.patch

              echo "continue-build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "continue-build=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload dependabot changeset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pre-build-checks.outputs.continue-build == 'false'
        with:
          name: dependabot-pr-changeset
          path: dependabot-pr/
          retention-days: 1

  initial-mvn-install:
    if: needs.pre-build-checks.outputs.continue-build == 'true'
    runs-on: ubuntu-latest
    needs: pre-build-checks
    outputs:
      matrix: ${{ steps.set-native-matrix.outputs.matrix }}
      examples-matrix: ${{ steps.set-examples-matrix.outputs.examples-matrix }}
      alternate-jvm-matrix: ${{ steps.set-alternate-jvm-matrix.outputs.alternate-jvm-matrix }}
      full-build: ${{ steps.scalpel-report.outputs.full-build || 'true' }}
    env:
      MAVEN_OPTS: -Xmx4600m
    steps:
      - name: Check free space on disk
        run: |
          df -h /
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Camel
        if: github.ref == 'refs/heads/camel-main' || github.base_ref == 'camel-main'
        run: |
          cd ../
          git clone --depth 1 --branch main https://github.com/apache/camel.git \
            && cd camel \
            && echo "Current Camel commit:" $(git rev-parse HEAD) \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -T1C
      - name: Build Quarkus
        if: github.ref == 'refs/heads/quarkus-main' || github.base_ref == 'quarkus-main'
        run: |
          git clone --depth 1 --branch main https://github.com/quarkusio/quarkus.git \
            && cd quarkus \
            && echo "Current Quarkus commit:" $(git rev-parse HEAD) \
            && sed -i '/<module>integration-tests<\/module>/d' pom.xml \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -Prelocations -T1C
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Update extension metadata
        run: |
          ./mvnw -N cq:update-quarkus-metadata ${CQ_MAVEN_ARGS}
      - name: mvn clean install -DskipTests
        run: |
          eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean install -DskipTests -Dquarkus.build.skip -Pformat
      - name: Generate Scalpel Impact Report
        if: github.event_name == 'pull_request'
        id: scalpel-report
        run: |
          # Generate Scalpel report (baseBranch auto-detected from GITHUB_BASE_REF)
          ./mvnw validate -Dscalpel.enabled=true \
            ${CQ_MAVEN_ARGS}
          
          # Check if full build was triggered
          if [ -f target/scalpel-report.json ]; then
            FULL_BUILD=$(jq -r '.fullBuildTriggered' target/scalpel-report.json)
            echo "full-build=${FULL_BUILD}" >> $GITHUB_OUTPUT
            
            # Log summary
            if [ "$FULL_BUILD" = "true" ]; then
              echo "::notice::Full build triggered"
              TRIGGER_FILE=$(jq -r '.triggerFile' target/scalpel-report.json)
              echo "::notice::Trigger file: ${TRIGGER_FILE}"
            else
              AFFECTED_COUNT=$(jq '.affectedModules | length' target/scalpel-report.json)
              echo "::notice::Incremental build: ${AFFECTED_COUNT} modules affected"
            fi
          else
            echo "full-build=true" >> $GITHUB_OUTPUT
            echo "::warning::Scalpel report not generated, defaulting to full build"
          fi
      - name: Upload Scalpel Reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scalpel-reports
          path: |
            target/scalpel-report.json
            target/scalpel-impacted.log
          retention-days: 1
      - name: Sync Maven properties
        run: |
          ./mvnw cq:sync-versions ${CQ_MAVEN_ARGS} -N
      # Commented out for Scalpel testing - Scalpel generates files that would fail this check
      # - name: Fail if there are uncommitted changes
      #   shell: bash
      #   run: |
      #     [[ -z $(git status --porcelain | grep -v antora.yml) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }
      - name: Tar Maven Repo
        shell: bash
        run: |
          tar -czf ${{ runner.temp }}/maven-repo.tgz -C ~ .m2/repository
          ls -lh ${{ runner.temp }}/maven-repo.tgz
          df -h /
      - name: Persist Maven Repo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-repo
          path: ${{ runner.temp }}/maven-repo.tgz
          retention-days: 1
      - name: Setup Native Test Matrix
        id: set-native-matrix
        run: |
          CATEGORIES=$(yq -M -N -I 0 -o=json e 'keys' tooling/scripts/test-categories.yaml | tr '"' "'")
          echo "matrix={'category': ${CATEGORIES}}" >> $GITHUB_OUTPUT
      - name: Setup Alternate JVM Matrix
        id: set-alternate-jvm-matrix
        shell: bash
        run: |
          cd integration-tests
          mvn help:evaluate -Dexpression=project.modules -N -q -DforceStdout | sed -e 's/<[^>]*>//g' -e 's/^[[:space:]]*//' -e '/^$/d' > ${{ runner.temp }}/itest-modules.txt
          MODULE_COUNT=$(wc -l < ${{ runner.temp }}/itest-modules.txt)
          GROUP1_COUNT=$((MODULE_COUNT / 2))
          GROUP2_COUNT=$((MODULE_COUNT - GROUP1_COUNT))
          GROUP1_MODULES=$(head -n $GROUP1_COUNT ${{ runner.temp }}/itest-modules.txt | tr '\n' ',' | sed 's/,$//')
          GROUP2_MODULES=$(tail -n $GROUP2_COUNT ${{ runner.temp }}/itest-modules.txt | tr '\n' ',' | sed 's/,$//')
          echo "alternate-jvm-matrix={'include': [{'name': 'group-01', 'modules': '${GROUP1_MODULES}'},{'name': 'group-02', 'modules': '${GROUP2_MODULES}'}]}" >> $GITHUB_OUTPUT
      - name: Setup Examples Matrix
        id: set-examples-matrix
        run: |
          EXAMPLES_BRANCH="camel-quarkus-main"
          if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_REF_NAME}
          elif [[ ${GITHUB_BASE_REF} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_BASE_REF}
          fi

          sudo apt install groovy -y --no-install-recommends
          EXAMPLES_MATRIX=$(groovy -DEXAMPLES_BRANCH=${EXAMPLES_BRANCH} tooling/scripts/generate-examples-matrix.groovy)
          echo "examples-matrix=${EXAMPLES_MATRIX}" >> $GITHUB_OUTPUT

  native-tests:
    name: Native Tests - ${{matrix.category}}
    needs: initial-mvn-install
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: Download Scalpel Reports
        if: github.event_name == 'pull_request' && needs.initial-mvn-install.outputs.full-build != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scalpel-reports
          path: target/
        continue-on-error: true
      - name: Filter Test Categories
        if: github.event_name == 'pull_request' && needs.initial-mvn-install.outputs.full-build != 'true'
        id: filter-categories
        run: |
          if [ -f target/scalpel-report.json ]; then
            # Use Maven mojo to filter test categories
            ./mvnw cq:filter-test-categories \
              -Dcq.category=${{ matrix.category }} \
              -Dcq.scalpelReportFile=target/scalpel-report.json \
              -Dcq.outputFile=target/filtered-modules.txt \
              -Dcq.outputFormat=list \
              -N ${CQ_MAVEN_ARGS}
            
            if [ -s target/filtered-modules.txt ]; then
              MODULE_COUNT=$(wc -l < target/filtered-modules.txt)
              echo "skip-tests=false" >> $GITHUB_OUTPUT
              echo "::notice::Running tests for ${MODULE_COUNT} modules in category ${{ matrix.category }}"
            else
              echo "skip-tests=true" >> $GITHUB_OUTPUT
              echo "::notice::No impacted modules in category ${{ matrix.category }}, skipping tests"
            fi
          else
            echo "skip-tests=false" >> $GITHUB_OUTPUT
            echo "::warning::Scalpel report not found, running full test suite"
          fi
      - name: Integration Tests
        if: steps.filter-categories.outputs.skip-tests != 'true'
        run: |
          # Determine which modules to test
          if [ -f target/filtered-modules.txt ]; then
            # Use filtered modules from Scalpel
            MODULES_FILE=target/filtered-modules.txt
            echo "::notice::Using filtered module list from Scalpel"
          else
            # Use all modules from test-categories.yaml (full build)
            yq -M -N e ".${{ matrix.category }}" tooling/scripts/test-categories.yaml | grep -vE '^\s*#' | cut -f2 -d' ' > target/all-modules.txt
            MODULES_FILE=target/all-modules.txt
            echo "::notice::Using full module list from test-categories.yaml"
          fi
          
          # Separate JVM and native modules
          JVM_MODULES=()
          NATIVE_MODULES=()
          
          for MODULE in $(cat ${MODULES_FILE}); do
            if [[ "${MODULE}" == "null" ]]; then
              continue
            fi

            MODULE="integration-tests/$(echo ${MODULE} | sed 's/^[ \t]*//;s/[ \t]*$//')"

            if [[ "x$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=ci.native.tests.skip -DforceStdout -q -f ${MODULE})" == "xtrue" ]]; then
              JVM_MODULES+=("${MODULE}")
            else
              NATIVE_MODULES+=("${MODULE}")
            fi
          done

          if [[ ${#JVM_MODULES[@]} -eq 0 ]] && [[ ${#NATIVE_MODULES[@]} -eq 0 ]]; then
            echo "No test modules were found for category ${{ matrix.category }}"
            exit 1
          fi

          IFS=,
          if [[ ${JVM_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean test \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Pdocker,ci \
              -pl "${JVM_MODULES[*]}"
          fi

          if [[ ${NATIVE_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean verify \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Dquarkus.native.builder-image.pull=missing \
              -Pnative,docker,ci \
              --fail-at-end \
              -pl "${NATIVE_MODULES[*]}"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests
      # Commented out for Scalpel testing - Scalpel generates files that would fail this check
      # - name: Fail if there are uncommitted changes
      #   shell: bash
      #   run: |
      #     [[ -z $(git status --porcelain) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }

  functional-extension-tests:
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: Download Scalpel Reports
        if: github.event_name == 'pull_request' && needs.initial-mvn-install.outputs.full-build != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scalpel-reports
          path: target/
        continue-on-error: true
      - name: Determine Affected Modules
        id: affected-modules
        run: |
          if [ -f target/scalpel-report.json ]; then
            FULL_BUILD=$(jq -r '.fullBuildTriggered' target/scalpel-report.json)
            
            if [ "$FULL_BUILD" = "true" ]; then
              echo "skip-tests=false" >> $GITHUB_OUTPUT
              echo "use-filter=false" >> $GITHUB_OUTPUT
              echo "::notice::Full build triggered, testing all modules"
            else
              # Extract affected modules
              AFFECTED_CORE=$(jq -r '.affectedModules[] | select(.path | startswith("extensions-core/")) | .path | sub("^extensions-core/"; "")' target/scalpel-report.json | sort -u | tr '\n' ',' | sed 's/,$//')
              AFFECTED_EXT=$(jq -r '.affectedModules[] | select(.path | startswith("extensions/")) | .path | sub("^extensions/"; "")' target/scalpel-report.json | sort -u | tr '\n' ',' | sed 's/,$//')
              AFFECTED_TEST=$(jq -r '.affectedModules[] | select(.path | startswith("test-framework/")) | .path | sub("^test-framework/"; "")' target/scalpel-report.json | sort -u | tr '\n' ',' | sed 's/,$//')
              AFFECTED_TOOL=$(jq -r '.affectedModules[] | select(.path | startswith("tooling/")) | .path | sub("^tooling/"; "")' target/scalpel-report.json | sort -u | tr '\n' ',' | sed 's/,$//')
              AFFECTED_CAT=$(jq -r '.affectedModules[] | select(.path | startswith("catalog/")) | .path | sub("^catalog/"; "")' target/scalpel-report.json | sort -u | tr '\n' ',' | sed 's/,$//')
              
              echo "affected-core=${AFFECTED_CORE}" >> $GITHUB_OUTPUT
              echo "affected-ext=${AFFECTED_EXT}" >> $GITHUB_OUTPUT
              echo "affected-test=${AFFECTED_TEST}" >> $GITHUB_OUTPUT
              echo "affected-tool=${AFFECTED_TOOL}" >> $GITHUB_OUTPUT
              echo "affected-cat=${AFFECTED_CAT}" >> $GITHUB_OUTPUT
              
              if [ -z "$AFFECTED_CORE" ] && [ -z "$AFFECTED_EXT" ] && [ -z "$AFFECTED_TEST" ] && [ -z "$AFFECTED_TOOL" ] && [ -z "$AFFECTED_CAT" ]; then
                echo "skip-tests=true" >> $GITHUB_OUTPUT
                echo "::notice::No affected modules in functional extensions, skipping tests"
              else
                echo "skip-tests=false" >> $GITHUB_OUTPUT
                echo "use-filter=true" >> $GITHUB_OUTPUT
                echo "::notice::Incremental build: testing affected modules only"
              fi
            fi
          else
            echo "skip-tests=false" >> $GITHUB_OUTPUT
            echo "use-filter=false" >> $GITHUB_OUTPUT
            echo "::warning::Scalpel report not found, running full test suite"
          fi
      - name: cd extensions-core && mvn test
        if: steps.affected-modules.outputs.skip-tests != 'true'
        run: |
          cd extensions-core
          
          if [ "${{ steps.affected-modules.outputs.use-filter }}" = "true" ] && [ -n "${{ steps.affected-modules.outputs.affected-core }}" ]; then
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "${{ steps.affected-modules.outputs.affected-core }}" -am \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
              --fail-at-end \
              test
          elif [ "${{ steps.affected-modules.outputs.use-filter }}" != "true" ]; then
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
              --fail-at-end \
              test
          else
            echo "::notice::No affected modules in extensions-core, skipping"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: extensions-core
      - name: cd extensions && mvn test
        if: steps.affected-modules.outputs.skip-tests != 'true'
        run: |
          cd extensions
          
          if [ "${{ steps.affected-modules.outputs.use-filter }}" = "true" ] && [ -n "${{ steps.affected-modules.outputs.affected-ext }}" ]; then
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "${{ steps.affected-modules.outputs.affected-ext }}" -am \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
              --fail-at-end \
              test
          elif [ "${{ steps.affected-modules.outputs.use-filter }}" != "true" ]; then
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
              --fail-at-end \
              test
          else
            echo "::notice::No affected modules in extensions, skipping"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: extensions
      - name: cd test-framework && mvn test
        if: steps.affected-modules.outputs.skip-tests != 'true'
