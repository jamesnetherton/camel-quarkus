# Stripped down CI that only builds the native images of every integration test module (tests are skipped)
# and collects GraalVM / Quarkus build statistics for analysis of native build times and binary sizes.

name: Native Build Stats

on:
  push:
    branches:
      - native-build-stats
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  MAVEN_OPTS: -Xmx3000m
  CQ_MAVEN_ARGS: -V -ntp -e -Daether.connector.http.connectionMaxTtl=120
  CQ_MAVEN_SKIP_CHECKS: "-Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip"

jobs:
  initial-mvn-install:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.maven-cache.outputs.cache-key }}
      integration-tests-matrix: ${{ steps.set-native-matrix.outputs.matrix }}
    env:
      MAVEN_OPTS: -Xmx4600m
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Maven Cache
        id: maven-cache
        uses: ./.github/actions/setup-maven-cache
      - name: mvn clean install -DskipTests
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} -T1C clean install -DskipTests -Dquarkus.build.skip ${CQ_MAVEN_SKIP_CHECKS}
      - name: Tar Maven Repo
        shell: bash
        run: |
          tar -I 'zstd -T0' -cf ${{ runner.temp }}/maven-repo.tar.zst -C ~ .m2/repository
          ls -lh ${{ runner.temp }}/maven-repo.tar.zst
      - name: Persist Maven Repo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-repo
          path: ${{ runner.temp }}/maven-repo.tar.zst
          retention-days: 1
      - name: Save Maven Cache
        uses: ./.github/actions/setup-maven-cache
        if: always()
        with:
          action: save
          cache-key: ${{ steps.maven-cache.outputs.cache-key }}
      - name: Setup Native Test Matrix
        id: set-native-matrix
        run: |
          CATEGORIES=$(yq -M -N -I 0 -o=json e 'keys' tooling/scripts/test-categories.yaml | tr '"' "'")
          echo "matrix={'category': ${CATEGORIES}}" >> $GITHUB_OUTPUT

  native-build-stats:
    name: Native Build Stats - ${{ matrix.category }}
    needs: initial-mvn-install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.integration-tests-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Maven Cache
        uses: ./.github/actions/setup-maven-cache
        with:
          cache-key: ${{ needs.initial-mvn-install.outputs.cache-key }}
          download-maven-repo: 'true'
      - name: Native Builds
        run: |
          for MODULE in $(yq -M -N e ".${{ matrix.category }}" tooling/scripts/test-categories.yaml | grep -vE '^\s*#' | cut -f2 -d' '); do
            MODULE="integration-tests/$(echo ${MODULE} | sed 's/^[ \t]*//;s/[ \t]*$//')"
            if grep -q '<ci.native.tests.skip>true</ci.native.tests.skip>' ${MODULE}/pom.xml; then
              echo "Skipping JVM only module ${MODULE}"
              continue
            fi
            NATIVE_MODULES+=("${MODULE}")
          done

          echo "${NATIVE_MODULES[*]}" > ${{ runner.temp }}/native-modules.txt

          ./mvnw ${CQ_MAVEN_ARGS} clean package \
            ${CQ_MAVEN_SKIP_CHECKS} \
            -DskipTests \
            -Dquarkus.builder.metrics.enabled=true \
            -Dquarkus.native.builder-image.pull=missing \
            -Pnative,docker,ci \
            --fail-at-end \
            -pl "$(IFS=,; echo "${NATIVE_MODULES[*]}")"
      - name: Collect Build Stats
        if: always()
        run: |
          STATS_DIR=${{ runner.temp }}/native-build-stats/${{ matrix.category }}
          for MODULE in $(cat ${{ runner.temp }}/native-modules.txt); do
            DEST=${STATS_DIR}/$(basename ${MODULE})
            mkdir -p ${DEST}
            cp ${MODULE}/target/build-metrics.json ${DEST}/ 2>/dev/null || true
            cp ${MODULE}/target/*-native-image-source-jar/*-build-output-stats.json ${DEST}/build-output-stats.json 2>/dev/null || true
            RUNNER=$(ls ${MODULE}/target/*-runner 2>/dev/null | head -1)
            if [[ -n "${RUNNER}" ]]; then
              stat -c %s "${RUNNER}" > ${DEST}/runner-size.txt
            fi
          done
          ls -R ${STATS_DIR}
          df -h /
      - name: Upload Build Stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-stats-${{ matrix.category }}
          path: ${{ runner.temp }}/native-build-stats/
          retention-days: 30

  aggregate-stats:
    needs: native-build-stats
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Build Stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-build-stats-*
          path: ${{ runner.temp }}/native-build-stats
          merge-multiple: true
      - name: Aggregate Build Stats
        run: |
          python3 .github/native-build-stats.py ${{ runner.temp }}/native-build-stats ${{ runner.temp }}/native-build-stats-summary >> $GITHUB_STEP_SUMMARY
      - name: Upload Aggregated Build Stats
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-stats-summary
          path: ${{ runner.temp }}/native-build-stats-summary/
          retention-days: 30
