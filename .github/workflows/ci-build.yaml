name: Camel Quarkus CI

on:
  push:
    branches:
      - incremental
      - camel-main
      - quarkus-main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'camel-quarkus-sbom/**'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/check-dependency-convergence.yml'
      - '.github/workflows/ci-semeru-jdk.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/jdk25-build.yaml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'
  pull_request:
    branches:
      - incremental
      - camel-main
      - quarkus-main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-lts-ci-build.yaml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  MAVEN_OPTS: -Xmx3000m
  CQ_MAVEN_ARGS: -V -ntp -e -Daether.connector.http.connectionMaxTtl=120
  TESTCONTAINERS_RYUK_DISABLED: true
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.head_ref || '' }}

jobs:
  pre-build-checks:
    runs-on: ubuntu-latest
    outputs:
      continue-build: ${{ steps.pre-build-checks.outputs.continue-build }}
      run-checks: ${{ steps.init.outputs.run-checks }}
    steps:
      - name: Initialize
        id: init
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            echo "run-checks=true" >> $GITHUB_OUTPUT
          else
            echo "run-checks=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: steps.init.outputs.run-checks == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.init.outputs.run-checks == 'true'
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Pre build checks
        id: pre-build-checks
        run: |
          if [[ "${{ steps.init.outputs.run-checks }}" == "true" ]]; then
            ./mvnw cq:sync-versions -N ${CQ_MAVEN_ARGS}
            ./mvnw clean install -pl poms/bom -am -Dcq.flatten-bom.format --fail-never ${CQ_MAVEN_ARGS}
            ./mvnw clean install -f poms/bom ${CQ_MAVEN_ARGS}
            ./mvnw clean validate -pl docs ${CQ_MAVEN_ARGS}

            if [[ -z "$(git status --porcelain)" ]]; then
              echo "continue-build=true" >> $GITHUB_OUTPUT
            else
              mkdir ./dependabot-pr
              echo ${{ github.head_ref }} > ./dependabot-pr/BRANCH_REF
              echo ${{ github.event.pull_request.head.sha }} > ./dependabot-pr/PR_HEAD_SHA
              echo "$GITHUB_REF" | awk -F / '{print $3}' >  ./dependabot-pr/PR_NUMBER
              git diff -p --binary > ./dependabot-pr/changes.patch

              echo "continue-build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "continue-build=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload dependabot changeset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.pre-build-checks.outputs.continue-build == 'false'
        with:
          name: dependabot-pr-changeset
          path: dependabot-pr/
          retention-days: 1

  initial-mvn-install:
    if: needs.pre-build-checks.outputs.continue-build == 'true'
    runs-on: ubuntu-latest
    needs: pre-build-checks
    outputs:
      matrix: ${{ steps.set-native-matrix.outputs.matrix }}
      examples-matrix: ${{ steps.set-examples-matrix.outputs.examples-matrix }}
      alternate-jvm-matrix: ${{ steps.set-alternate-jvm-matrix.outputs.alternate-jvm-matrix }}
      functional-extension-tests-modules: ${{ steps.set-functional-tests.outputs.modules }}
      extensions-jvm-tests-matrix: ${{ steps.set-jvm-tests.outputs.matrix }}
      full-build: ${{ steps.detect-changes.outputs.full-build }}
    env:
      MAVEN_OPTS: -Xmx4600m
    steps:
      - name: Check free space on disk
        run: |
          df -h /
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Camel
        if: github.ref == 'refs/heads/camel-main' || github.base_ref == 'camel-main'
        run: |
          cd ../
          git clone --depth 1 --branch main https://github.com/apache/camel.git \
            && cd camel \
            && echo "Current Camel commit:" $(git rev-parse HEAD) \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -T1C
      - name: Build Quarkus
        if: github.ref == 'refs/heads/quarkus-main' || github.base_ref == 'quarkus-main'
        run: |
          git clone --depth 1 --branch main https://github.com/quarkusio/quarkus.git \
            && cd quarkus \
            && echo "Current Quarkus commit:" $(git rev-parse HEAD) \
            && sed -i '/<module>integration-tests<\/module>/d' pom.xml \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -Prelocations -T1C
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Update extension metadata
        run: |
          ./mvnw -N cq:update-quarkus-metadata ${CQ_MAVEN_ARGS}
      - name: mvn clean install -DskipTests
        run: |
          eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean install -DskipTests -Dquarkus.build.skip -Pformat
      - name: Sync Maven properties
        run: |
          ./mvnw cq:sync-versions ${CQ_MAVEN_ARGS} -N
      - name: Fail if there are uncommitted changes
        shell: bash
        run: |
          [[ -z $(git status --porcelain | grep -v antora.yml) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }
      - name: Get project version
        id: get-version
        run: |
          CQ_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout -N)
          echo "version=${CQ_VERSION}" >> $GITHUB_OUTPUT
      - name: Determine base commit
        id: base-commit
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, use the merge base with the target branch
            BASE_SHA=$(git merge-base HEAD ${{ github.event.pull_request.base.sha }})
            echo "base-commit=${BASE_SHA}" >> $GITHUB_OUTPUT
            echo "Using PR merge-base: ${BASE_SHA}"
          else
            # For pushes, use the previous commit
            BASE_SHA="${{ github.event.before }}"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]; then
              # First push or no previous commit, use HEAD~1
              BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            echo "base-commit=${BASE_SHA}" >> $GITHUB_OUTPUT
            echo "Using commit: ${BASE_SHA}"
          fi
      - name: Tar Maven Repo
        shell: bash
        run: |
          tar -czf ${{ runner.temp }}/maven-repo.tgz -C ~ .m2/repository
          ls -lh ${{ runner.temp }}/maven-repo.tgz
          df -h /
      - name: Persist Maven Repo
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: maven-repo
          path: ${{ runner.temp }}/maven-repo.tgz
          retention-days: 1
      - name: Detect Changed Modules
        id: detect-changes
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} -N org.apache.camel.quarkus:camel-quarkus-maven-plugin:${{ steps.get-version.outputs.version }}:detect-changed-modules \
            -DbaseCommit=${{ steps.base-commit.outputs.base-commit }} \
            -DoutputFile=${{ runner.temp }}/changed-modules.json
          
          if [ -f "${{ runner.temp }}/changed-modules.json" ]; then
            CHANGED_MODULES=$(cat ${{ runner.temp }}/changed-modules.json)
            echo "changed-modules=${CHANGED_MODULES}" >> $GITHUB_OUTPUT
            
            FULL_BUILD=$(echo "${CHANGED_MODULES}" | jq -r '.["full-build"]')
            echo "full-build=${FULL_BUILD}" >> $GITHUB_OUTPUT
            
            echo "Incremental build analysis complete:"
            echo "Full build required: ${FULL_BUILD}"
            echo "${CHANGED_MODULES}" | jq .
          else
            echo "Detection failed, falling back to full build"
            echo "full-build=true" >> $GITHUB_OUTPUT
            echo "changed-modules={\"full-build\":true}" >> $GITHUB_OUTPUT
          fi
      - name: Setup Native Test Matrix
        id: set-native-matrix
        run: |
          CHANGED_MODULES='${{ steps.detect-changes.outputs.changed-modules }}'
          NATIVE_TESTS=$(echo "${CHANGED_MODULES}" | jq -c '.["native-tests"]')
          echo "matrix=${NATIVE_TESTS}" >> $GITHUB_OUTPUT
      - name: Setup Alternate JVM Matrix
        id: set-alternate-jvm-matrix
        run: |
          CHANGED_MODULES='${{ steps.detect-changes.outputs.changed-modules }}'
          ALT_JDK_MATRIX=$(echo "${CHANGED_MODULES}" | jq -c '.["integration-tests-alternative-jdk"]')
          echo "alternate-jvm-matrix=${ALT_JDK_MATRIX}" >> $GITHUB_OUTPUT
      - name: Setup Functional Extension Tests
        id: set-functional-tests
        run: |
          CHANGED_MODULES='${{ steps.detect-changes.outputs.changed-modules }}'
          MODULES=$(echo "${CHANGED_MODULES}" | jq -c '.["functional-extension-tests"].include[0].modules // []')
          echo "modules=${MODULES}" >> $GITHUB_OUTPUT
      - name: Setup JVM Extension Tests Matrix
        id: set-jvm-tests
        run: |
          CHANGED_MODULES='${{ steps.detect-changes.outputs.changed-modules }}'
          JVM_TESTS=$(echo "${CHANGED_MODULES}" | jq -c '.["extensions-jvm-tests"]')
          echo "matrix=${JVM_TESTS}" >> $GITHUB_OUTPUT
      - name: Setup Examples Matrix
        id: set-examples-matrix
        run: |
          EXAMPLES_BRANCH="camel-quarkus-main"
          if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_REF_NAME}
          elif [[ ${GITHUB_BASE_REF} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_BASE_REF}
          fi

          sudo apt install groovy -y --no-install-recommends
          EXAMPLES_MATRIX=$(groovy -DEXAMPLES_BRANCH=${EXAMPLES_BRANCH} tooling/scripts/generate-examples-matrix.groovy)
          echo "examples-matrix=${EXAMPLES_MATRIX}" >> $GITHUB_OUTPUT

  native-tests:
    name: Native Tests - ${{matrix.category}}
    needs: initial-mvn-install
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')) &&
      fromJson(needs.initial-mvn-install.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: Integration Tests
        env:
          AFFECTED_MODULES: ${{ toJson(matrix.modules) }}
        run: |
          # Plugin provides the modules to test
          MODULES_TO_TEST=$(echo "${AFFECTED_MODULES}" | jq -r '.[]' 2>/dev/null || echo "")

          if [ -z "${MODULES_TO_TEST}" ]; then
            echo "No modules to test for category ${{ matrix.category }}"
            exit 0
          fi

          # Process modules to determine JVM-only vs native
          JVM_MODULES=()
          NATIVE_MODULES=()

          for MODULE in ${MODULES_TO_TEST}; do
            if [[ "${MODULE}" == "null" ]] || [[ -z "${MODULE}" ]]; then
              continue
            fi

            MODULE="integration-tests/$(echo ${MODULE} | sed 's/^[ \t]*//;s/[ \t]*$//')"

            if [[ "x$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=ci.native.tests.skip -DforceStdout -q -f ${MODULE})" == "xtrue" ]]; then
              JVM_MODULES+=("${MODULE}")
            else
              NATIVE_MODULES+=("${MODULE}")
            fi
          done

          if [[ ${#JVM_MODULES[@]} -eq 0 ]] && [[ ${#NATIVE_MODULES[@]} -eq 0 ]]; then
            echo "No test modules were found for category ${{ matrix.category }}"
            exit 0
          fi

          IFS=,
          if [[ ${JVM_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean test \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Pdocker,ci \
              -pl "${JVM_MODULES[*]}"
          fi

          if [[ ${NATIVE_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean verify \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Dquarkus.native.builder-image.pull=missing \
              -Pnative,docker,ci \
              --fail-at-end \
              -pl "${NATIVE_MODULES[*]}"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests
      - name: Fail if there are uncommitted changes
        shell: bash
        run: |
          [[ -z $(git status --porcelain) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }

  functional-extension-tests:
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: |
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')) &&
      needs.initial-mvn-install.outputs.functional-extension-tests-modules != '[]'
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: cd extensions-core && mvn test
        if: contains(fromJson(needs.initial-mvn-install.outputs.functional-extension-tests-modules), 'extensions-core')
        run: |
          cd extensions-core
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
            --fail-at-end \
            test
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: extensions-core
      - name: cd extensions && mvn test
        if: contains(fromJson(needs.initial-mvn-install.outputs.functional-extension-tests-modules), 'extensions')
        run: |
          cd extensions
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
            --fail-at-end \
            test
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: extensions
      - name: cd test-framework && mvn test
        if: contains(fromJson(needs.initial-mvn-install.outputs.functional-extension-tests-modules), 'test-framework')
        run: |
          cd test-framework
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip -Dcamel-quarkus.update-extension-doc-page.skip \
            --fail-at-end \
            test
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: test-framework
      - name: cd tooling && mvn verify
        if: contains(fromJson(needs.initial-mvn-install.outputs.functional-extension-tests-modules), 'tooling')
        run: |
          cd tooling
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            --fail-at-end \
            verify
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: tooling
      - name: cd catalog && mvn test
        if: contains(fromJson(needs.initial-mvn-install.outputs.functional-extension-tests-modules), 'catalog')
        run: |
          cd catalog
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            test
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: catalog

  integration-tests-jvm:
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: fromJson(needs.initial-mvn-install.outputs.extensions-jvm-tests-matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: cd integration-tests-jvm && mvn clean test
        run: |
          cd integration-tests-jvm

          # Plugin provides the modules to test
          CHANGED_MODULES='${{ needs.initial-mvn-install.outputs.changed-modules }}'
          JVM_MODULES=$(echo "${CHANGED_MODULES}" | jq -r '.["extensions-jvm-tests"].include[0].modules | join(",")')

          if [ -n "${JVM_MODULES}" ] && [ "${JVM_MODULES}" != "null" ]; then
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "${JVM_MODULES}" \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean test
          else
            echo "No JVM test modules to build"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests-jvm

  integration-tests-alternative-jdk:
    name: Integration Tests Alternative JDK 21 ${{matrix.category}}
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: |
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')) &&
      fromJson(needs.initial-mvn-install.outputs.alternate-jvm-matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.alternate-jvm-matrix) }}
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: cd integration-tests && mvn clean verify
        env:
          TEST_MODULES: ${{ toJson(matrix.modules) }}
        run: |
          cd integration-tests

          # Plugin has already filtered modules for this group
          MODULES=$(echo "${TEST_MODULES}" | jq -r 'join(",")')

          if [ -z "${MODULES}" ] || [ "${MODULES}" = "null" ]; then
            echo "No modules to test for ${{ matrix.category }}"
            exit 0
          fi

          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
            -pl "${MODULES}" \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            --fail-at-end \
            clean verify
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests

  integration-tests-alternative-platform:
    runs-on: ${{ matrix.os }}
    needs: initial-mvn-install
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest' ]
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    env:
      MAVEN_OPTS: -Xmx3000m -Xms3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          mkdir "D:\\temp"
          mkdir "D:\\maven-repo"
          tar -xzf ../maven-repo.tgz -C "D:\\maven-repo"
          rm -f ../maven-repo.tgz
      - name: cd integration-tests && mvn clean verify
        shell: bash
        env:
          TEMP: D:\\temp
          TMP: D:\\temp
          MAVEN_REPO_LOCAL: D:\\maven-repo\.m2\repository
        run: |
          cd integration-tests
          ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} -Dmaven.repo.local='${{ env.MAVEN_REPO_LOCAL }}' \
            -Dskip-testcontainers-tests -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            --fail-at-end \
            clean verify
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests

