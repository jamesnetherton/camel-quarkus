name: Camel Quarkus CI

on:
  push:
    branches:
      - main
      - camel-main
      - quarkus-main
      - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - 'camel-quarkus-sbom/**'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/check-dependency-convergence.yml'
      - '.github/workflows/ci-semeru-jdk.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/jdk25-build.yaml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'
  pull_request:
    branches:
      # TEMPORARY: Accept all branches for testing
      - '*'
      # - main
      # - camel-main
      # - quarkus-main
      # - "[0-9]+.[0-9]+.x"
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'Jenkinsfile'
      - 'Jenkinsfile.*'
      - 'KEYS'
      - 'LICENSE.txt'
      - 'NOTICE.txt'
      - '.github/*.sh'
      - '.github/*.yaml'
      - '.github/*.yml'
      - '.github/workflows/assign-issue-milestone.yaml'
      - '.github/workflows/assign-wontfix-issue-milestone.yaml'
      - '.github/workflows/camel-master-cron.yaml'
      - '.github/workflows/generate-sbom-main.yml'
      - '.github/workflows/label-issue.yaml'
      - '.github/workflows/pr-validate.yml'
      - '.github/workflows/quarkus-lts-ci-build.yaml'
      - '.github/workflows/quarkus-master-cron.yaml'
      - '.github/workflows/synchronize-dependabot-branch.yaml'
      - '.github/workflows/pr-doc-validation.yaml'
      - 'docs/antora.yml'
      - 'release-utils/**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  MAVEN_OPTS: -Xmx3000m
  CQ_MAVEN_ARGS: -V -ntp -e -Daether.connector.http.connectionMaxTtl=120
  TESTCONTAINERS_RYUK_DISABLED: true
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.head_ref || '' }}

jobs:
  pre-build-checks:
    # TEMPORARY: Allow fork testing
    if: true  # was: github.repository == 'apache/camel-quarkus'
    runs-on: ubuntu-latest
    outputs:
      continue-build: ${{ steps.pre-build-checks.outputs.continue-build }}
      run-checks: ${{ steps.init.outputs.run-checks }}
    steps:
      - name: Initialize
        id: init
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            echo "run-checks=true" >> $GITHUB_OUTPUT
          else
            echo "run-checks=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: steps.init.outputs.run-checks == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.init.outputs.run-checks == 'true'
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Pre build checks
        id: pre-build-checks
        run: |
          if [[ "${{ steps.init.outputs.run-checks }}" == "true" ]]; then
            ./mvnw cq:sync-versions -N ${CQ_MAVEN_ARGS}
            ./mvnw clean install -pl poms/bom -am -Dcq.flatten-bom.format --fail-never ${CQ_MAVEN_ARGS}
            ./mvnw clean install -f poms/bom ${CQ_MAVEN_ARGS}
            ./mvnw clean validate -pl docs ${CQ_MAVEN_ARGS}

            if [[ -z "$(git status --porcelain)" ]]; then
              echo "continue-build=true" >> $GITHUB_OUTPUT
            else
              mkdir ./dependabot-pr
              echo ${{ github.head_ref }} > ./dependabot-pr/BRANCH_REF
              echo ${{ github.event.pull_request.head.sha }} > ./dependabot-pr/PR_HEAD_SHA
              echo "$GITHUB_REF" | awk -F / '{print $3}' >  ./dependabot-pr/PR_NUMBER
              git diff -p --binary > ./dependabot-pr/changes.patch

              echo "continue-build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "continue-build=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload dependabot changeset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pre-build-checks.outputs.continue-build == 'false'
        with:
          name: dependabot-pr-changeset
          path: dependabot-pr/
          retention-days: 1

  initial-mvn-install:
    if: needs.pre-build-checks.outputs.continue-build == 'true'
    runs-on: ubuntu-latest
    needs: pre-build-checks
    outputs:
      matrix: ${{ steps.set-native-matrix.outputs.matrix }}
      examples-matrix: ${{ steps.set-examples-matrix.outputs.examples-matrix }}
      alternate-jvm-matrix: ${{ steps.set-alternate-jvm-matrix.outputs.alternate-jvm-matrix }}
      use-filtered-matrix: ${{ steps.filter-categories.outputs.use-filtered-matrix }}
      filtered-matrix: ${{ steps.filter-categories.outputs.filtered-matrix }}
      run-jvm-tests: ${{ steps.check-jvm-tests.outputs.run-jvm-tests }}
      run-extensions-core-tests: ${{ steps.detect-functional-tests.outputs.run-extensions-core-tests }}
      run-extensions-tests: ${{ steps.detect-functional-tests.outputs.run-extensions-tests }}
      run-test-framework-tests: ${{ steps.detect-functional-tests.outputs.run-test-framework-tests }}
      run-tooling-tests: ${{ steps.detect-functional-tests.outputs.run-tooling-tests }}
      run-catalog-tests: ${{ steps.detect-functional-tests.outputs.run-catalog-tests }}
    env:
      MAVEN_OPTS: -Xmx4600m
    steps:
      - name: Check free space on disk
        run: |
          df -h /
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Camel
        if: github.ref == 'refs/heads/camel-main' || github.base_ref == 'camel-main'
        run: |
          cd ../
          git clone --depth 1 --branch main https://github.com/apache/camel.git \
            && cd camel \
            && echo "Current Camel commit:" $(git rev-parse HEAD) \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -T1C
      - name: Build Quarkus
        if: github.ref == 'refs/heads/quarkus-main' || github.base_ref == 'quarkus-main'
        run: |
          git clone --depth 1 --branch main https://github.com/quarkusio/quarkus.git \
            && cd quarkus \
            && echo "Current Quarkus commit:" $(git rev-parse HEAD) \
            && sed -i '/<module>integration-tests<\/module>/d' pom.xml \
            && ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -Prelocations -T1C
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Detect PR Incremental Build
        id: detect-incremental
        if: github.event_name == 'pull_request'
        run: |
          echo "incremental-build=true" >> $GITHUB_OUTPUT
      - name: Update extension metadata
        run: |
          ./mvnw -N cq:update-quarkus-metadata ${CQ_MAVEN_ARGS}
      - name: mvn clean install -DskipTests
        run: |
          eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean install -DskipTests -Dquarkus.build.skip -Pformat
      - name: Scalpel Analysis
        id: scalpel-analysis
        if: steps.detect-incremental.outputs.incremental-build == 'true'
        continue-on-error: true
        run: |
          ./mvnw validate -Dquickly \
            -Dscalpel.enabled=true \
            -Dscalpel.mode=report \
            -Dscalpel.fullBuildTriggers="poms/**,extensions-core/**,tooling/maven-plugin/**,.mvn/**,pom.xml" \
            -Dscalpel.excludePaths="**.adoc,**.md,docs/**,Jenkinsfile*,LICENSE.txt,NOTICE.txt,KEYS,camel-quarkus-sbom/**,.github/*.sh" \
            ${CQ_MAVEN_ARGS}

          if [ -f target/scalpel-report.json ]; then
            echo "Scalpel report generated successfully"
            cat target/scalpel-report.json | jq '{fullBuildTriggered, triggerFile, affectedModulesCount: (.affectedModules | length)}'
          else
            echo "Scalpel report not found"
            exit 1
          fi
      - name: Filter Test Categories
        id: filter-categories
        if: steps.detect-incremental.outputs.incremental-build == 'true'
        continue-on-error: true
        run: |
          ./mvnw org.apache.camel.quarkus:camel-quarkus-maven-plugin:3.36.0-SNAPSHOT:filter-test-categories -N ${CQ_MAVEN_ARGS}

          if [ -f target/filtered-matrix.json ]; then
            FULL_BUILD=$(jq -r '.fullBuild' target/filtered-matrix.json)

            echo "Filtered matrix generated:"
            cat target/filtered-matrix.json

            if [ "$FULL_BUILD" == "true" ]; then
              echo "Full build required"
              echo "use-filtered-matrix=false" >> $GITHUB_OUTPUT
            else
              echo "Incremental build enabled"
              # Compact JSON to single line for GitHub Actions output
              FILTERED_COMPACT=$(jq -c '.' target/filtered-matrix.json)
              echo "use-filtered-matrix=true" >> $GITHUB_OUTPUT
              echo "filtered-matrix=${FILTERED_COMPACT}" >> $GITHUB_OUTPUT
            fi
          else
            echo "Filtered matrix not found - falling back to full build"
            echo "use-filtered-matrix=false" >> $GITHUB_OUTPUT
          fi
      - name: Check Incremental Build Status
        if: steps.detect-incremental.outputs.incremental-build == 'true'
        run: |
          if [ "${{ steps.scalpel-analysis.outcome }}" == "failure" ] || \
             [ "${{ steps.filter-categories.outcome }}" == "failure" ]; then
            echo "Incremental build analysis failed - will run full build"
          elif [ "${{ steps.filter-categories.outputs.use-filtered-matrix }}" == "true" ]; then
            echo "Incremental build will be used"
          else
            echo "Full build will be used"
          fi
      - name: Sync Maven properties
        run: |
          ./mvnw cq:sync-versions ${CQ_MAVEN_ARGS} -N
      - name: Fail if there are uncommitted changes
        shell: bash
        run: |
          # TEMPORARY: Disabled for incremental build testing
          # [[ -z $(git status --porcelain | grep -v antora.yml) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }
          echo "Uncommitted changes check temporarily disabled"
      - name: Tar Maven Repo
        shell: bash
        run: |
          tar -czf ${{ runner.temp }}/maven-repo.tgz -C ~ .m2/repository
          ls -lh ${{ runner.temp }}/maven-repo.tgz
          df -h /
      - name: Persist Maven Repo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-repo
          path: ${{ runner.temp }}/maven-repo.tgz
          retention-days: 1
      - name: Setup Native Test Matrix
        id: set-native-matrix
        run: |
          # Check if we should use incremental build
          if [ "${{ steps.filter-categories.outputs.use-filtered-matrix }}" == "true" ]; then
            echo "Using incremental build with dynamic matrix"

            # Read affected modules from filter output
            MODULES_JSON=$(jq -c '.modules' target/filtered-matrix.json)
            MODULE_COUNT=$(echo "$MODULES_JSON" | jq 'length')

            # Ensure clean integer (remove any whitespace)
            MODULE_COUNT=$(echo "$MODULE_COUNT" | tr -d '[:space:]')

            echo "Affected modules ($MODULE_COUNT): $MODULES_JSON"

            # Distribute modules across up to 13 balanced groups
            MAX_GROUPS=13
            echo "DEBUG: MODULE_COUNT=$MODULE_COUNT, MAX_GROUPS=$MAX_GROUPS"

            # Use arithmetic comparison for reliable integer comparison
            if (( MODULE_COUNT <= MAX_GROUPS )); then
              # Each module gets its own group
              GROUPS=$MODULE_COUNT
              echo "DEBUG: Using MODULE_COUNT as GROUPS ($GROUPS)"
            else
              # Cap at 13 groups
              GROUPS=$MAX_GROUPS
              echo "DEBUG: Capping GROUPS at MAX_GROUPS ($GROUPS)"
            fi

            echo "Distributing across $GROUPS parallel jobs"

            # Build matrix using jq to distribute modules evenly
            MATRIX=$(echo "$MODULES_JSON" | jq -c --argjson groups "$GROUPS" '
              # Calculate modules per group (ceiling division)
              (length / $groups | ceil) as $per_group |
              # Store the modules array
              . as $modules |
              # Group modules into chunks
              [range($groups)] | map({
                name: ("group-" + (. + 1 | tostring)),
                modules: ($per_group * . as $start | $per_group * (. + 1) as $end |
                          [$modules[$start:$end][]] | join(","))
              }) |
              # Filter out empty groups
              map(select(.modules != "")) |
              {include: .}
            ')

            echo "Dynamic matrix: $MATRIX"

            # Validate matrix size
            MATRIX_SIZE=$(echo "$MATRIX" | jq '.include | length')
            echo "Native tests matrix size: $MATRIX_SIZE jobs"
            if [ "$MATRIX_SIZE" -gt 20 ]; then
              echo "ERROR: Native tests matrix size ($MATRIX_SIZE) exceeds maximum expected (20)"
              echo "Matrix content: $MATRIX"
              exit 1
            fi

            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          else
            echo "Using all test categories (full build)"
            CATEGORIES=$(yq -M -N -I 0 -o=json e 'keys' tooling/scripts/test-categories.yaml | tr '"' "'")
            MATRIX_FULL="{'category': ${CATEGORIES}}"

            # Validate matrix size (convert single quotes to double quotes for jq)
            MATRIX_SIZE=$(echo "$MATRIX_FULL" | sed "s/'/\"/g" | jq '.category | length')
            echo "Native tests matrix size: $MATRIX_SIZE jobs (full build)"
            if [ "$MATRIX_SIZE" -gt 20 ]; then
              echo "ERROR: Native tests matrix size ($MATRIX_SIZE) exceeds maximum expected (20)"
              echo "Matrix content: $MATRIX_FULL"
              exit 1
            fi

            echo "matrix=$MATRIX_FULL" >> $GITHUB_OUTPUT
          fi
      - name: Setup Alternate JVM Matrix
        id: set-alternate-jvm-matrix
        shell: bash
        run: |
          if [ "${{ steps.filter-categories.outputs.use-filtered-matrix }}" == "true" ]; then
            # Incremental build - use filtered modules
            MODULES_JSON=$(jq -c '.modules' target/filtered-matrix.json)
            MODULE_COUNT=$(echo "$MODULES_JSON" | jq 'length')

            if [ "$MODULE_COUNT" -eq 0 ]; then
              # No modules affected - create empty matrix
              ALT_MATRIX="{'include': []}"
              echo "Alternate JVM matrix: 0 jobs (no modules affected)"
              echo "alternate-jvm-matrix=$ALT_MATRIX" >> $GITHUB_OUTPUT
            else
              # Split modules into 2 groups
              GROUP1_COUNT=$((MODULE_COUNT / 2))
              if [ "$GROUP1_COUNT" -eq 0 ]; then
                GROUP1_COUNT=1
              fi
              GROUP2_COUNT=$((MODULE_COUNT - GROUP1_COUNT))

              GROUP1_MODULES=$(echo "$MODULES_JSON" | jq -r --argjson count "$GROUP1_COUNT" '.[:$count] | join(",")')
              GROUP2_MODULES=$(echo "$MODULES_JSON" | jq -r --argjson start "$GROUP1_COUNT" '.[$start:] | join(",")')

              if [ -n "$GROUP2_MODULES" ]; then
                ALT_MATRIX="{'include': [{'name': 'group-01', 'modules': '${GROUP1_MODULES}'},{'name': 'group-02', 'modules': '${GROUP2_MODULES}'}]}"
                echo "Alternate JVM matrix: 2 jobs"
              else
                ALT_MATRIX="{'include': [{'name': 'group-01', 'modules': '${GROUP1_MODULES}'}]}"
                echo "Alternate JVM matrix: 1 job"
              fi

              # Validate matrix size (convert single quotes to double quotes for jq)
              MATRIX_SIZE=$(echo "$ALT_MATRIX" | sed "s/'/\"/g" | jq '.include | length')
              if [ "$MATRIX_SIZE" -gt 5 ]; then
                echo "ERROR: Alternate JVM matrix size ($MATRIX_SIZE) exceeds maximum expected (5)"
                echo "Matrix content: $ALT_MATRIX"
                exit 1
              fi

              echo "alternate-jvm-matrix=$ALT_MATRIX" >> $GITHUB_OUTPUT
            fi
          else
            # Full build - use all modules
            cd integration-tests
            mvn help:evaluate -Dexpression=project.modules -N -q -DforceStdout | sed -e 's/<[^>]*>//g' -e 's/^[[:space:]]*//' -e '/^$/d' > ${{ runner.temp }}/itest-modules.txt
            MODULE_COUNT=$(wc -l < ${{ runner.temp }}/itest-modules.txt)
            GROUP1_COUNT=$((MODULE_COUNT / 2))
            GROUP2_COUNT=$((MODULE_COUNT - GROUP1_COUNT))
            GROUP1_MODULES=$(head -n $GROUP1_COUNT ${{ runner.temp }}/itest-modules.txt | tr '\n' ',' | sed 's/,$//')
            GROUP2_MODULES=$(tail -n $GROUP2_COUNT ${{ runner.temp }}/itest-modules.txt | tr '\n' ',' | sed 's/,$//')
            ALT_MATRIX="{'include': [{'name': 'group-01', 'modules': '${GROUP1_MODULES}'},{'name': 'group-02', 'modules': '${GROUP2_MODULES}'}]}"

            echo "Alternate JVM matrix: 2 jobs (full build)"

            # Validate matrix size (convert single quotes to double quotes for jq)
            MATRIX_SIZE=$(echo "$ALT_MATRIX" | sed "s/'/\"/g" | jq '.include | length')
            if [ "$MATRIX_SIZE" -gt 5 ]; then
              echo "ERROR: Alternate JVM matrix size ($MATRIX_SIZE) exceeds maximum expected (5)"
              echo "Matrix content: $ALT_MATRIX"
              exit 1
            fi

            echo "alternate-jvm-matrix=$ALT_MATRIX" >> $GITHUB_OUTPUT
          fi
      - name: Check if JVM Tests Should Run
        id: check-jvm-tests
        shell: bash
        run: |
          if [ "${{ steps.filter-categories.outputs.use-filtered-matrix }}" == "true" ]; then
            # Incremental build - check if any JVM-only integration tests are affected
            cd integration-tests-jvm
            JVM_MODULES=$(mvn help:evaluate -Dexpression=project.modules -N -q -DforceStdout | sed -e 's/<[^>]*>//g' -e 's/^[[:space:]]*//' -e '/^$/d')

            # Get affected modules from filtered matrix
            AFFECTED_MODULES=$(echo '${{ steps.filter-categories.outputs.filtered-matrix }}' | jq -r '.modules[]')

            # Check if any affected module is in JVM modules
            SHOULD_RUN=false
            for MODULE in $AFFECTED_MODULES; do
              if echo "$JVM_MODULES" | grep -q "^${MODULE}$"; then
                SHOULD_RUN=true
                break
              fi
            done

            echo "run-jvm-tests=$SHOULD_RUN" >> $GITHUB_OUTPUT
            if [ "$SHOULD_RUN" == "true" ]; then
              echo "JVM-only integration tests will run (affected modules found)"
            else
              echo "JVM-only integration tests will be skipped (no JVM-only modules affected)"
            fi
          else
            # Full build - always run JVM tests
            echo "run-jvm-tests=true" >> $GITHUB_OUTPUT
          fi
      - name: Detect Functional Test Scope
        id: detect-functional-tests
        shell: bash
        run: |
          if [ "${{ steps.filter-categories.outputs.use-filtered-matrix }}" == "true" ]; then
            # Incremental build - detect which functional test directories are affected
            # Filter to category="DIRECT" to avoid testing upstream dependencies
            # (e.g., if box changes, don't test extensions-core that box depends on)
            AFFECTED_PATHS=$(jq -r '.affectedModules[] | select(.category == "DIRECT") | .path' target/scalpel-report.json)

            echo "Debug: Directly affected paths (category=DIRECT):"
            echo "$AFFECTED_PATHS"

            # Initialize flags
            RUN_EXTENSIONS_CORE=false
            RUN_EXTENSIONS=false
            RUN_TEST_FRAMEWORK=false
            RUN_TOOLING=false
            RUN_CATALOG=false

            # Parse affected paths and categorize
            while IFS= read -r PATH; do
              if [[ "$PATH" == extensions-core/* ]]; then
                RUN_EXTENSIONS_CORE=true
              elif [[ "$PATH" == extensions-jvm/* ]] || [[ "$PATH" == extensions/* ]]; then
                RUN_EXTENSIONS=true
              elif [[ "$PATH" == test-framework/* ]]; then
                RUN_TEST_FRAMEWORK=true
              elif [[ "$PATH" == tooling/* ]]; then
                RUN_TOOLING=true
              elif [[ "$PATH" == catalog/* ]]; then
                RUN_CATALOG=true
              fi
            done <<< "$AFFECTED_PATHS"

            echo "run-extensions-core-tests=$RUN_EXTENSIONS_CORE" >> $GITHUB_OUTPUT
            echo "run-extensions-tests=$RUN_EXTENSIONS" >> $GITHUB_OUTPUT
            echo "run-test-framework-tests=$RUN_TEST_FRAMEWORK" >> $GITHUB_OUTPUT
            echo "run-tooling-tests=$RUN_TOOLING" >> $GITHUB_OUTPUT
            echo "run-catalog-tests=$RUN_CATALOG" >> $GITHUB_OUTPUT

            echo "Functional test scope detection:"
            echo "  extensions-core: $RUN_EXTENSIONS_CORE"
            echo "  extensions: $RUN_EXTENSIONS"
            echo "  test-framework: $RUN_TEST_FRAMEWORK"
            echo "  tooling: $RUN_TOOLING"
            echo "  catalog: $RUN_CATALOG"
          else
            # Full build - run all functional tests
            echo "run-extensions-core-tests=true" >> $GITHUB_OUTPUT
            echo "run-extensions-tests=true" >> $GITHUB_OUTPUT
            echo "run-test-framework-tests=true" >> $GITHUB_OUTPUT
            echo "run-tooling-tests=true" >> $GITHUB_OUTPUT
            echo "run-catalog-tests=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup Examples Matrix
        id: set-examples-matrix
        run: |
          EXAMPLES_BRANCH="camel-quarkus-main"
          if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_REF_NAME}
          elif [[ ${GITHUB_BASE_REF} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_BASE_REF}
          fi

          sudo apt install groovy -y --no-install-recommends
          EXAMPLES_MATRIX=$(groovy -DEXAMPLES_BRANCH=${EXAMPLES_BRANCH} tooling/scripts/generate-examples-matrix.groovy)
          echo "examples-matrix=${EXAMPLES_MATRIX}" >> $GITHUB_OUTPUT

  native-tests:
    name: Native Tests - ${{ matrix.name || matrix.category }}
    needs: initial-mvn-install
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: Integration Tests
        run: |
          # Check if this is incremental build (modules) or full build (category)
          if [ -n "${{ matrix.modules }}" ]; then
            echo "Incremental build - running modules: ${{ matrix.modules }}"
            # Split comma-separated modules
            IFS=',' read -ra MODULE_LIST <<< "${{ matrix.modules }}"
            for MODULE_NAME in "${MODULE_LIST[@]}"; do
              MODULE="integration-tests/${MODULE_NAME}"

              if [[ "x$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=ci.native.tests.skip -DforceStdout -q -f ${MODULE})" == "xtrue" ]]; then
                JVM_MODULES+=("${MODULE}")
              else
                NATIVE_MODULES+=("${MODULE}")
              fi
            done
          else
            echo "Full build - running category: ${{ matrix.category }}"
            # Original category-based logic
            for MODULE in $(yq -M -N e ".${{ matrix.category }}" tooling/scripts/test-categories.yaml | grep -vE '^\s*#' | cut -f2 -d' '); do
              if [[ "${MODULE}" == "null" ]]; then
                continue
              fi

              MODULE="integration-tests/$(echo ${MODULE} | sed 's/^[ \t]*//;s/[ \t]*$//')"

              if [[ "x$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=ci.native.tests.skip -DforceStdout -q -f ${MODULE})" == "xtrue" ]]; then
                JVM_MODULES+=("${MODULE}")
              else
                NATIVE_MODULES+=("${MODULE}")
              fi
            done
          fi

          if [[ ${#JVM_MODULES[@]} -eq 0 ]] && [[ ${#NATIVE_MODULES[@]} -eq 0 ]]; then
            echo "No test modules were found"
            exit 1
          fi

          IFS=,
          if [[ ${JVM_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean test \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Pdocker,ci \
              -pl "${JVM_MODULES[*]}"
          fi

          if [[ ${NATIVE_MODULES[@]} ]]; then
            eval ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} clean verify \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              -Dquarkus.native.builder-image.pull=missing \
              -Pnative,docker,ci \
              --fail-at-end \
              -pl "${NATIVE_MODULES[*]}"
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests
      - name: Fail if there are uncommitted changes
        shell: bash
        run: |
          # TEMPORARY: Disabled for incremental build testing
          # [[ -z $(git status --porcelain) ]] || { echo 'There are uncommitted changes'; git status; git diff; exit 1; }
          echo "Uncommitted changes check temporarily disabled"

