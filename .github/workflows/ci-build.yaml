  integration-tests-jvm:
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: needs.initial-mvn-install.outputs.run-jvm-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: cd integration-tests-jvm && mvn clean test
        run: |
          cd integration-tests-jvm

          JVM_MODULES="${{ needs.initial-mvn-install.outputs.jvm-modules }}"

          # For incremental builds with specific modules
          if [ -n "$JVM_MODULES" ]; then
            echo "Running incremental JVM tests for: $JVM_MODULES"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "$JVM_MODULES" \
              -am \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean test
          else
            # Full build - run all JVM tests
            echo "Running all JVM tests"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean test
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests-jvm

  integration-tests-alternative-jdk:
    name: Integration Tests Alternative JDK 21 ${{ needs.initial-mvn-install.outputs.use-filtered-matrix == 'true' && '(incremental)' || matrix.name }}
    runs-on: ubuntu-latest
    needs: initial-mvn-install
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    strategy:
      fail-fast: false
      matrix: ${{ needs.initial-mvn-install.outputs.use-filtered-matrix == 'true' && fromJson('{"include":[{"name":"incremental"}]}') || fromJson(needs.initial-mvn-install.outputs.alternate-jvm-matrix) }}
    env:
      MAVEN_OPTS: -Xmx3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Reclaim Disk Space
        run: .github/reclaim-disk-space.sh
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: cd integration-tests && mvn clean verify
        shell: bash
        run: |
          cd integration-tests
          if [ "${{ needs.initial-mvn-install.outputs.use-filtered-matrix }}" == "true" ]; then
            # Incremental build - use affected modules from filtered matrix
            AFFECTED_MODULES=$(echo '${{ needs.initial-mvn-install.outputs.filtered-matrix }}' | jq -r '.modules | join(",")')
            echo "Running incremental build with affected modules: $AFFECTED_MODULES"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "$AFFECTED_MODULES" \
              -am \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean verify
          else
            # Full build - use module list from matrix
            echo "Running full build with module list: ${{ matrix.modules }}"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} \
              -pl "${{ matrix.modules }}" \
              -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean verify
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests

  integration-tests-alternative-platform:
    runs-on: ${{ matrix.os }}
    needs: initial-mvn-install
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest' ]
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    env:
      MAVEN_OPTS: -Xmx3000m -Xms3000m
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          mkdir "D:\\temp"
          mkdir "D:\\maven-repo"
          tar -xzf ../maven-repo.tgz -C "D:\\maven-repo"
          rm -f ../maven-repo.tgz
      - name: cd integration-tests && mvn clean verify
        shell: bash
        env:
          TEMP: D:\\temp
          TMP: D:\\temp
          MAVEN_REPO_LOCAL: D:\\maven-repo\.m2\repository
        run: |
          cd integration-tests
          if [ "${{ needs.initial-mvn-install.outputs.use-filtered-matrix }}" == "true" ]; then
            # Incremental build - use affected modules from filtered matrix
            AFFECTED_MODULES=$(echo '${{ needs.initial-mvn-install.outputs.filtered-matrix }}' | jq -r '.modules | join(",")')
            echo "Running incremental build with affected modules: $AFFECTED_MODULES"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} -Dmaven.repo.local='${{ env.MAVEN_REPO_LOCAL }}' \
              -pl "$AFFECTED_MODULES" \
              -am \
              -Dskip-testcontainers-tests -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean verify
          else
            # Full build - run all modules
            echo "Running full build - all modules"
            ../mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} -Dmaven.repo.local='${{ env.MAVEN_REPO_LOCAL }}' \
              -Dskip-testcontainers-tests -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
              --fail-at-end \
              clean verify
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
        with:
          test-report-xml-base-dir: integration-tests

  examples-tests:
    name: Examples Tests - ${{matrix.name}}
    needs: initial-mvn-install
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'JVM')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.initial-mvn-install.outputs.examples-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Maven Repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: ..
      - name: Extract Maven Repo
        shell: bash
        run: |
          df -h /
          tar -xzf ../maven-repo.tgz -C ~
          rm -f ../maven-repo.tgz
          df -h /
      - name: set CQ_VERSION
        run: echo "CQ_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout -N)" >> $GITHUB_ENV
      - name: clone and verify examples
        env:
          EXAMPLE_MODULES: ${{matrix.examples}}
        shell: '/usr/bin/bash {0}'
        run: |
          EXAMPLES_BRANCH="camel-quarkus-main"

          if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_REF_NAME}
          elif [[ ${GITHUB_BASE_REF} =~ [0-9]+.[0-9]+.x ]]; then
              EXAMPLES_BRANCH=${GITHUB_BASE_REF}
          fi

          git clone --depth 1 --branch ${EXAMPLES_BRANCH} https://github.com/apache/camel-quarkus-examples.git \
            && cd camel-quarkus-examples \
            && echo "Current Examples commit:" $(git rev-parse HEAD) \
            && ./mvnw ${CQ_MAVEN_ARGS} ${BRANCH_OPTIONS} org.l2x6.cq:cq-maven-plugin:2.10.0:examples-set-platform -Dcq.camel-quarkus.version=${CQ_VERSION}

          # Filter examples for incremental builds
          MODULES_TO_BUILD="${EXAMPLE_MODULES//,/ }"

          if [ "${{ needs.initial-mvn-install.outputs.use-filtered-matrix }}" == "true" ]; then
            echo "Incremental build detected - filtering examples based on affected extensions"

            # Get affected modules from filtered matrix
            AFFECTED_MODULES=$(echo '${{ needs.initial-mvn-install.outputs.filtered-matrix }}' | jq -r '.modules[]')
            echo "Affected modules: $AFFECTED_MODULES"

            # Check if extensions-core/core is affected (build all examples if so)
            if echo "$AFFECTED_MODULES" | grep -q "^core$"; then
              echo "Core extension affected - building all examples"
            else
              # Filter examples based on dependency analysis
              FILTERED_MODULES=()

              for MODULE in ${EXAMPLE_MODULES//,/ }; do
                echo "Analyzing dependencies for example: $MODULE"
                cd ${MODULE}

                # Generate dependency list
                ../mvnw ${CQ_MAVEN_ARGS} quarkus:dependency-list -DoutputFile=target/deps.txt -q 2>/dev/null || true

                if [ -f target/deps.txt ]; then
                  # Check if any affected extension appears in dependencies
                  SHOULD_BUILD=false
                  for AFFECTED in $AFFECTED_MODULES; do
                    # Convert module name to artifact ID (e.g., "box" -> "camel-quarkus-box")
                    ARTIFACT_ID="camel-quarkus-${AFFECTED}"
                    # Use word boundary matching to avoid partial matches (e.g., box matching dropbox)
                    if grep -qw "$ARTIFACT_ID" target/deps.txt; then
                      echo "  → Depends on affected extension: $ARTIFACT_ID"
                      SHOULD_BUILD=true
                      break
                    fi
                  done

                  if [ "$SHOULD_BUILD" == "true" ]; then
                    FILTERED_MODULES+=("$MODULE")
                  else
                    echo "  → No affected dependencies - skipping"
                  fi
                else
                  echo "  → Could not determine dependencies - including for safety"
                  FILTERED_MODULES+=("$MODULE")
                fi

                cd -
              done

              if [ ${#FILTERED_MODULES[@]} -eq 0 ]; then
                echo "No examples depend on affected extensions - skipping all"
                exit 0
              fi

              MODULES_TO_BUILD="${FILTERED_MODULES[@]}"
              echo "Filtered examples to build: $MODULES_TO_BUILD"
            fi
          fi

          BUILD_FAILURES=()

          for MODULE in $MODULES_TO_BUILD; do
            echo "Building example: $MODULE"
            cd ${MODULE}

            ../mvnw ${CQ_MAVEN_ARGS} clean verify \
              -Dformatter.skip -Dimpsort.skip \
              -Dquarkus.native.builder-image.pull=missing \
              -Pnative,docker,ci

            if [[ $? -ne 0 ]]; then
              BUILD_FAILURES[${#BUILD_FAILURES[@]}]=${MODULE}
            fi

            cd -
          done

          if [[ ${#BUILD_FAILURES[@]} -gt 0 ]]; then
            echo -e "\nBuild errors were encountered in the following projects:\n"
            for FAILURE in ${BUILD_FAILURES[@]}; do
                echo "* ${FAILURE}"
            done
            echo -e "\nCheck build logs for further information."
            exit 1
          fi
      - name: Report test failures
        uses: ./.github/actions/test-summary-report
        if: ${{ failure() }}
